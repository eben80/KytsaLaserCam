<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Web Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>ESP32 Remote Control</h1>

    <div>
        <label for="deviceSelect">Select Device:</label>
        <select id="deviceSelect"><option value="">Loading devices...</option></select>
        <p>WebSocket Status: <span id="ws-status">Disconnected</span></p>
        <p>Selected Device ID: <span id="selected-device-id">None</span></p>
    </div>

    <div class="container">
        <div class="controls">
            <h2>Controls (<span id="control-target-device">No Target</span>)</h2>
            <div class="control-group">
                <h3><button id="toggleServoConfigBtn" class="toggle-btn">+/-</button> Servo Configuration</h3>
                <div id="servoConfigContent" style="display: none;">
                    <label for="servoX">Servo X:</label>
                    <input type="range" id="servoX" min="0" max="180" value="90" disabled> <span id="servoXValue">90</span><br>
                    <button id="setXMinBtn" disabled>Set X Min</button>
                    <button id="setXMaxBtn" disabled>Set X Max</button><br>
                    <label for="servoY">Servo Y:</label>
                    <input type="range" id="servoY" min="45" max="135" value="90" disabled> <span id="servoYValue">90</span><br>
                    <button id="setYMinBtn" disabled>Set Y Min</button>
                    <button id="setYMaxBtn" disabled>Set Y Max</button><br>
                </div>
            </div>
            <div class="control-group">
                <h3>Motion</h3>
                <button id="randomMotionToggle" disabled>Toggle Random Motion</button><br>
            </div>
            <div class="control-group">
                <h3>ESP32 CAM</h3>
                <button id="toggleCamStreamBtn" disabled>Toggle CAM Stream</button><br>
                <button id="toggleCamLedBtn" disabled>Toggle CAM LED</button><br>
            </div>
            <!-- Timer Configuration Section Moved Here -->
            <div class="timer-controls">
                <h2>Timer Configuration</h2>
                <label for="timerStartTime">Start Time:</label>
                <input type="time" id="timerStartTime" disabled><br>
                <label for="timerEndTime">End Time:</label>
                <input type="time" id="timerEndTime" disabled><br>
                <button id="addTimerBtn" disabled>Add Timer</button>
                <h3>Scheduled Timers</h3>
                <div id="timerList">
                    <!-- Timer entries will be added here by script.js -->
                </div>
            </div>
        </div>

        <div class="stream-section">
            <h2>Live Stream</h2>
            <div id="stream-container">
                <img id="stream" src="#" alt="Live Stream Paused" width="640" height="480">
            </div>
        </div>

        <div class="status-section">
            <h2><button id="toggleDeviceStatusBtn" class="toggle-btn">+/-</button> Device Status (<span id="status-target-device">No Target</span>)</h2>
            <div id="deviceStatusContent" style="display: none;">
                <pre id="deviceStatus">Waiting for updates...</pre>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
